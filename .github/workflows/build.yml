name: Prepare OpenWrt 25.12.5 SDK

on:
  workflow_dispatch:

jobs:
  prepare-sdk:
    runs-on: ubuntu-latest

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd build-essential libncurses-dev gawk gettext rsync unzip file python3

      - name: Download OpenWrt SDK
        run: |
          wget -q --show-progress \
            https://downloads.openwrt.org/releases/25.12.5/targets/qualcommax/ipq807x/openwrt-sdk-25.12.5-qualcommax-ipq807x_gcc-14.3.0_musl.Linux-x86_64.tar.zst

      - name: Verify SDK checksum
        run: |
          echo "7aabdda8607c372cb0fd526f0eede2f680ae7d95a4758a38bbb49381e5c97621  openwrt-sdk-25.12.5-qualcommax-ipq807x_gcc-14.3.0_musl.Linux-x86_64.tar.zst" | sha256sum -c -

      - name: Extract SDK
        run: |
          mkdir sdk
          tar --zstd \
            -xf openwrt-sdk-25.12.5-qualcommax-ipq807x_gcc-14.3.0_musl.Linux-x86_64.tar.zst \
            -C sdk \
            --strip-components=1

      - name: Update and install feeds
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate SDK config
        run: |
          cd sdk
          make defconfig

      - name: Check configuration
        run: |
          cd sdk
          echo "===== .config exists ====="
          ls -lh .config
          echo "===== target ====="
          grep -E 'CONFIG_TARGET_qualcommax|CONFIG_TARGET_qualcommax_ipq807x' .config || true
          echo "===== ffmpeg packages ====="
          ./scripts/feeds search ffmpeg | head -30 || true
