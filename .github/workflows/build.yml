name: Configure FFmpeg HEVC

on:
  workflow_dispatch:

jobs:
  configure-ffmpeg:
    runs-on: ubuntu-latest

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd build-essential libncurses-dev gawk gettext rsync unzip file python3

      - name: Download OpenWrt SDK
        run: |
          wget -q --show-progress \
            https://downloads.openwrt.org/releases/25.12.5/targets/qualcommax/ipq807x/openwrt-sdk-25.12.5-qualcommax-ipq807x_gcc-14.3.0_musl.Linux-x86_64.tar.zst

      - name: Verify SDK checksum
        run: |
          echo "7aabdda8607c372cb0fd526f0eede2f680ae7d95a4758a38bbb49381e5c97621  openwrt-sdk-25.12.5-qualcommax-ipq807x_gcc-14.3.0_musl.Linux-x86_64.tar.zst" | sha256sum -c -

      - name: Extract SDK
        run: |
          mkdir sdk
          tar --zstd \
            -xf openwrt-sdk-25.12.5-qualcommax-ipq807x_gcc-14.3.0_musl.Linux-x86_64.tar.zst \
            -C sdk \
            --strip-components=1

      - name: Update and install feeds
        run: |
          cd sdk

          cat > feeds.conf <<'EOF'
          src-git packages https://github.com/openwrt/packages.git;openwrt-25.12
          src-git luci https://github.com/openwrt/luci.git;openwrt-25.12
          src-git routing https://github.com/openwrt/routing.git;openwrt-25.12
          src-git telephony https://github.com/openwrt/telephony.git;openwrt-25.12
          src-git video https://github.com/openwrt/video.git;openwrt-25.12
          EOF
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: Configure custom FFmpeg
        run: |
          cd sdk

          make defconfig
     
          # Tắt chế độ build hàng loạt package của SDK
          for opt in ALL BUILDBOT ALL_NONSHARED ALL_KMODS; do
            sed -i "/^CONFIG_${opt}=/d" .config
            sed -i "/^# CONFIG_${opt} is not set/d" .config
            echo "# CONFIG_${opt} is not set" >> .config
          done

          # Xóa các package module dư có sẵn trong cấu hình SDK
          sed -i '/^CONFIG_PACKAGE_.*=m$/d' .config

          # Chuẩn hóa lại cấu hình sau khi dọn module
          make defconfig

          set_y() {
            sed -i "/^CONFIG_$1=/d" .config
            sed -i "/^# CONFIG_$1 is not set/d" .config
            echo "CONFIG_$1=y" >> .config
          }

          set_n() {
            sed -i "/^CONFIG_$1=/d" .config
            sed -i "/^# CONFIG_$1 is not set/d" .config
            echo "# CONFIG_$1 is not set" >> .config
          }
    
          # Loại bỏ các variant/dependency không cần cho FFmpeg custom
          set_n PACKAGE_go2rtc
          set_n PACKAGE_ffmpeg
          set_n PACKAGE_ffprobe
          set_n PACKAGE_libffmpeg-full
          set_n PACKAGE_libffmpeg-mini
          set_n PACKAGE_libffmpeg-audio-dec

          set_n PACKAGE_libgnutls-dane
          set_n PACKAGE_libunbound

          set_y PACKAGE_libffmpeg-custom

          # Tùy chọn này tự chọn ffmpeg-custom + ffprobe-custom
          set_y FFMPEG_CUSTOM_PROGRAMS

          set_y FFMPEG_CUSTOM_PATENTED
          set_y FFMPEG_CUSTOM_PARSER_hevc

          set_y FFMPEG_CUSTOM_DEMUXER_rtsp
          set_y FFMPEG_CUSTOM_PROTOCOL_tcp
          set_y FFMPEG_CUSTOM_PROTOCOL_file

          set_y FFMPEG_CUSTOM_MUXER_mpegts
          set_y FFMPEG_CUSTOM_MUXER_mp4
          
          make defconfig

      - name: Check custom FFmpeg configuration
        run: |
          cd sdk

          echo "===== Packages ====="
          grep -E '^CONFIG_PACKAGE_(libffmpeg-custom|ffmpeg-custom|ffprobe-custom)=' .config

          echo "===== HEVC ====="
          grep -E '^CONFIG_FFMPEG_CUSTOM_(PATENTED|PARSER_hevc|DECODER_hevc)=' .config

          echo "===== RTSP input ====="
          grep -E '^CONFIG_FFMPEG_CUSTOM_(DEMUXER_rtsp|PROTOCOL_tcp)=' .config

          echo "===== Output ====="
          grep -E '^CONFIG_FFMPEG_CUSTOM_(PROTOCOL_file|MUXER_mpegts|MUXER_mp4)=' .config
          echo "===== Unwanted packages ====="
          grep -E '^CONFIG_PACKAGE_(go2rtc|ffmpeg|ffprobe|libffmpeg-full|libffmpeg-mini|libffmpeg-audio-dec|libgnutls-dane|libunbound)=' .config || true

          echo "===== TLS / GnuTLS / Nettle ====="
          grep -Ei '^(CONFIG_.*(GNUTLS|NETTLE|TLS).*)' .config || true

          echo "===== FFmpeg source references to GnuTLS ====="
          grep -RniE 'gnutls|nettle' \
            feeds/packages/multimedia/ffmpeg/Makefile \
            feeds/packages/multimedia/ffmpeg/Config.in || true
            
          echo "===== Global SDK build flags ====="
          grep -E '^(CONFIG_(ALL|ALL_NONSHARED|ALL_KMODS|DEVEL|BUILDBOT|AUTOREMOVE|SDK|MAKE_TOOLCHAIN))=' .config || true

          echo "===== Global SDK disabled flags ====="
          grep -E '^# CONFIG_(ALL|ALL_NONSHARED|ALL_KMODS|DEVEL|BUILDBOT|AUTOREMOVE|SDK|MAKE_TOOLCHAIN) is not set' .config || true

          echo "===== Reverse selectors ====="
          grep -nE 'select PACKAGE_(ffmpeg|libffmpeg-full|libunbound|libgnutls)([^A-Za-z0-9_-]|$)' \
            tmp/.config-package.in || true
          
          echo "===== Selector owners ====="

          grep -n -B8 -A2 'select PACKAGE_libffmpeg-full' \
            tmp/.config-package.in || true

          grep -n -B8 -A2 'select PACKAGE_ffmpeg' \
            tmp/.config-package.in || true

          grep -n -B8 -A2 'select PACKAGE_libunbound' \
            tmp/.config-package.in || true

          grep -n -B8 -A2 'select PACKAGE_libgnutls' \
            tmp/.config-package.in || true
          echo "===== FFmpeg Makefile lines 300-390 ====="
          nl -ba feeds/packages/multimedia/ffmpeg/Makefile | sed -n '300,390p'

          echo "===== FFmpeg Makefile lines 430-510 ====="
          nl -ba feeds/packages/multimedia/ffmpeg/Makefile | sed -n '430,510p'

          echo "===== FFmpeg BuildPackage registrations ====="
          grep -nE 'BuildPackage,' \
            feeds/packages/multimedia/ffmpeg/Makefile || true

          echo "===== FFmpeg program package definitions ====="
          grep -n -A15 -B2 -E \
            '^define Package/(ffmpeg|ffprobe|ffmpeg-custom|ffprobe-custom)$' \
            feeds/packages/multimedia/ffmpeg/Makefile || true
      - name: Build custom FFmpeg packages
        if: ${{ false }}
        run: |
          cd sdk
          make package/feeds/packages/ffmpeg/compile V=s
